name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LATEST_CHANGE.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LATEST_CHANGE.md'

env:
  BuildConfiguration: Release

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10

      - name: Restore NuGet packages
        run: dotnet restore **/*.sln

      - name: Build solution
        run: dotnet build **/*.sln --configuration ${{ env.BuildConfiguration }} --no-restore

      - name: Run unit tests
        run: dotnet test **/**/*UnitTests*.csproj --configuration ${{ env.BuildConfiguration }} --no-build

      - name: Create NuGet packages
        if: steps.version.outputs.is_release == 'true'
        run: |
          for project in src/**/*.csproj; do
            dotnet pack "$project" \
              --configuration ${{ env.BuildConfiguration }} \
              --no-build \
              --output ./artifacts \
              -p:PackageVersion=${{ steps.version.outputs.version }} \
              --include-symbols
          done
        shell: bash

      - name: Copy release notes
        if: steps.version.outputs.is_release == 'true'
        run: |
          if [ -f "LATEST_CHANGE.md" ]; then
            cp LATEST_CHANGE.md ./artifacts/
          fi
        shell: bash

      - name: Upload artifacts
        if: steps.version.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/

  release:
    name: Release Package
    needs: build
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    environment: NuGet

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: ./artifacts

      - name: Push to NuGet
        run: |
          for package in ./artifacts/*.nupkg; do
            if [[ ! "$package" =~ \.symbols\.nupkg$ ]]; then
              dotnet nuget push "$package" \
                --api-key ${{ secrets.NUGET_API_KEY }} \
                --source https://api.nuget.org/v3/index.json \
                --skip-duplicate
            fi
          done
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ./artifacts/LATEST_CHANGE.md
          files: ./artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
